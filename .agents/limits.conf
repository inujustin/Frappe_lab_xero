# Time budgets for agent work in this repo (AGENTS.md A14).
# The human edits these values by hand at any time; agents read this file and never edit it.
# These are guides the agent paces itself by, not timers: nothing kills a request when the time is up.

# How long one request (one task, one trace, one review) is meant to take, in minutes.
AGENT_REQUEST_MINUTES=10

# Longest a single command (a task's Verification command) may be expected to run, in seconds.
AGENT_COMMAND_SECONDS=120
